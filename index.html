<style>
@font-face {
  font-family: 'Raleway';

<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body {
  width:100vw; height:100vh; overflow:hidden;
  background:#ffffff;
  font-family:"Raleway","Helvetica Neue",sans-serif;
  cursor:none; user-select:none; -webkit-font-smoothing:antialiased;
}
img, video { -webkit-user-drag:none; user-drag:none; pointer-events:none; }

#cur {
  position:fixed;z-index:9999;width:8px;height:8px;border-radius:50%;
  background:#0a0a0a;pointer-events:none;transform:translate(-50%,-50%);
  transition:width .18s,height .18s,background .15s,border .15s;top:0;left:0;
}
#cur.drag{width:44px;height:44px;background:transparent;border:1.5px solid #0a0a0a;}
#cur.link{width:28px;height:28px;background:transparent;border:1.5px solid #0a0a0a;}
#cur.light{background:#fff;}
#cur.light.drag{background:transparent;border-color:#fff;}
#cur.light.link{background:transparent;border-color:#fff;}

nav {
  position:fixed;top:0;left:0;right:0;padding:22px 36px;
  display:flex;align-items:center;justify-content:space-between;z-index:850;
  transition:background 0.3s ease, border-bottom 0.3s ease;
}
nav.solid {
  background:rgba(245,244,240,0.55);
  border-bottom:1px solid rgba(224,221,216,0.4);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  padding-top:14px;
  padding-bottom:14px;
}
nav a {
  font-size:clamp(16px, 2.2vw, 32px);letter-spacing:0.05em;text-transform:uppercase;text-decoration:none;transition:opacity .2s;
  font-family:"Raleway",sans-serif;font-weight:100;
  background:linear-gradient(to bottom,#3a3a3a 0%,#a0a0a0 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  pointer-events:all;line-height:1;
}
nav a:hover{opacity:.5;}
.nav-mid{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:48px;align-items:center;}
#nav-project {
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:#2a2a2a;margin-left:18px;
  opacity:0;transform:translateY(6px);
  transition:opacity .4s ease, transform .4s ease;
  display:inline-block;vertical-align:middle;
  -webkit-text-fill-color:#2a2a2a;background:none;
  text-shadow:0 0 12px rgba(255,255,255,0.8), 0 0 24px rgba(255,255,255,0.6);
}
#nav-project.visible{opacity:1;transform:translateY(0);}
#clock{font-family:"Courier New",monospace;font-size:clamp(10px, 1.1vw, 16px);color:#aaa;letter-spacing:.05em;transition:opacity 0.3s ease;}
#clock.hidden{opacity:0;pointer-events:none;}

footer {
  position:fixed;bottom:0;left:0;right:0;padding:20px 36px;
  display:flex;justify-content:space-between;align-items:flex-end;z-index:500;pointer-events:none;
}
.f-left p,.f-left a,.f-right a {
  display:block;font-size:10px;color:#aaa;text-decoration:none;line-height:1.9;
  pointer-events:all;transition:color .2s;
}
.f-left a:hover,.f-right a:hover{color:#0a0a0a;}
.f-right{text-align:right;}

#scene {
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  z-index:10;touch-action:none;transform-style:preserve-3d;
}
#camera{width:0;height:0;transform-style:preserve-3d;will-change:transform;}
#ring {
  position:absolute;width:0;height:0;transform-style:preserve-3d;
  transform:rotateY(0deg);will-change:transform;
}
.slot{position:absolute;transform-style:preserve-3d;}
.face {
  position:absolute;border-radius:3px;overflow:hidden;
  backface-visibility:hidden;cursor:none;
  box-shadow:0 4px 24px rgba(0,0,0,.12),0 1px 4px rgba(0,0,0,.08);
  transition:opacity .4s ease;
}
.face-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
.face-slide {
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
  transform:translateX(100%);transition:transform 0.6s ease;
}
.face-slide.active{transform:translateX(0%);}
.face-slide.prev{transform:translateX(-100%);}
.face-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}

#overlay {
  position:fixed;inset:0;z-index:800;background:#ffffff;
  opacity:0;pointer-events:none;overflow-y:auto;
}
#overlay.open{opacity:1;pointer-events:all;}
#overlay img, #overlay video { pointer-events:auto; }

.ov-content {
  position:sticky;
  top:72px;
  padding:120px 36px 40px;
  opacity:0;transform:translateY(100px);
  transition:opacity 1.2s cubic-bezier(0.2,1,0.3,1), transform 1.2s cubic-bezier(0.2,1,0.3,1);
  z-index:1;
}
.ov-content.visible{opacity:1;transform:translateY(0);}
.ov-desc{font-size:clamp(11px, 1vw, 13px);line-height:1.85;color:#888;max-width:480px;margin-bottom:40px;}
.ov-cols {
  display:grid;grid-template-columns:repeat(3,180px);
  padding-bottom:20px;margin-bottom:40px;
}
.ov-col-label{display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#b0b0b0;margin-bottom:6px;}
.ov-col-val{display:block;font-size:13px;font-weight:700;color:#0a0a0a;}
.ov-grid {
  display:grid;grid-template-columns:1fr 1fr;gap:3px;width:100vw;
  position:relative;
  z-index:10;
  background:#ffffff;
  margin-top:20px;
  opacity:0;transform:translateY(100px);
  transition:opacity 1.2s cubic-bezier(0.2,1,0.3,1), transform 1.2s cubic-bezier(0.2,1,0.3,1);
  transition-delay:0.15s;
}
.ov-grid.visible{opacity:1;transform:translateY(0);}
.ov-grid-item {
  overflow:hidden;background:#e4e4e0;position:relative;
  opacity:0;transform:translateY(40px);
  transition:opacity 0.9s cubic-bezier(0.2,1,0.3,1), transform 0.9s cubic-bezier(0.2,1,0.3,1);
}
.ov-grid-item.in-view{opacity:1;transform:translateY(0);}
.ov-grid-item.full{grid-column:1/-1;}
.ov-grid-item img,.ov-grid-item video{width:100%;height:auto;display:block;}

.ov-grid-item .mute-btn {
  position:absolute;bottom:12px;right:12px;z-index:10;
  width:32px;height:32px;border-radius:50%;
  background:rgba(0,0,0,.45);backdrop-filter:blur(6px);
  border:none;cursor:none;pointer-events:all;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s, transform .15s;
}
.ov-grid-item .mute-btn:hover{background:rgba(0,0,0,.7);transform:scale(1.1);}
.ov-grid-item .mute-btn svg{width:14px;height:14px;fill:#fff;}

#close-btn {
  position:fixed;top:22px;right:36px;z-index:900;
  font-size:12px;letter-spacing:.12em;text-transform:uppercase;
  background:none;border:none;font-family:"Raleway",sans-serif;font-weight:300;
  color:#2a2a2a;cursor:none;display:none;pointer-events:all;
  text-shadow:0 0 12px rgba(255,255,255,0.8), 0 0 24px rgba(255,255,255,0.6);
}
#close-btn.on{display:block;}

/* ── Info Layout ── */
.ov-info-layout{
  display:grid;
  grid-template-columns:1fr 1fr;
  min-height:100vh;
  opacity:0;
  transform:translateY(40px);
  transition:opacity 0.8s ease, transform 0.8s cubic-bezier(0.2,1,0.3,1);
}
.ov-info-layout.visible{
  opacity:1;
  transform:translateY(0);
}
.ov-info-left{
  padding:120px 64px 80px 80px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.ov-info-right{
  position:sticky;
  top:0;
  height:100vh;
  overflow:hidden;
}

#arc-wrap{
  position:absolute;inset:0;
  overflow:hidden;
  cursor:grab;
  background:#f7f7f7;
  background-image:radial-gradient(circle,#d0d0d0 1px,transparent 1px);
  background-size:32px 32px;
}
#arc-canvas{
  position:absolute;
  top:0;left:0;
  width:2400px;height:1600px;
  transform-origin:0 0;
  will-change:transform;
}
.arc-item{
  position:absolute;
  box-shadow:0 4px 24px rgba(0,0,0,0.10);
  overflow:hidden;
}

@media (max-width: 600px) {
  nav { padding: 16px 20px; }
  nav a { font-size: 13px; }
  .nav-mid { position: static; transform: none; gap: 24px; }
  #clock { display: none; }
  #nav-project { display: none; }
  body:has(#close-btn.on) .nav-mid { visibility: hidden; }
}

/* ── Erweiterungen 10/2026 – in der Formensprache der Seite ──
   Typo wie die Navigation (Raleway 100, Versal, Grauverlauf), Labels 9px #b0b0b0,
   Flächen Weiß / #f7f7f7 mit Punktraster wie im Archiv, Schatten wie die Karten,
   Bewegung: Einblenden von unten mit cubic-bezier(0.2,1,0.3,1). */
html,body{overscroll-behavior:none;}

/* Projekttitel im Stil des Namens oben links */
.ov-title{font-family:"Raleway",sans-serif;font-weight:100;font-size:clamp(28px,4.4vw,64px);line-height:1.08;letter-spacing:.05em;text-transform:uppercase;margin:0 0 36px;}
.ov-title .ln{display:block;}
.ov-title .ln > span{display:inline-block;background:linear-gradient(to bottom,#3a3a3a 0%,#a0a0a0 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  opacity:0;transform:translateY(40px);transition:opacity .9s cubic-bezier(0.2,1,0.3,1),transform .9s cubic-bezier(0.2,1,0.3,1);}
.ov-title .ln:nth-child(2) > span{transition-delay:.08s;}
.ov-title.in .ln > span{opacity:1;transform:none;}

/* Abschluss jedes Projekts: wie der Info-Bereich */
.ov-finale{position:relative;z-index:11;background:#fff;padding:120px 36px 80px;}
.ov-lbl{display:block;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:#b0b0b0;margin-bottom:16px;font-family:"Raleway",sans-serif;}
.ov-next{display:inline-block;font-family:"Raleway",sans-serif;font-weight:100;font-size:clamp(24px,3.2vw,44px);letter-spacing:.05em;text-transform:uppercase;line-height:1.1;text-decoration:none;cursor:none;margin:0 0 96px;
  background:linear-gradient(to bottom,#3a3a3a 0%,#a0a0a0 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;transition:opacity .2s;}
.ov-next:hover{opacity:.5;}
.ov-cta{display:grid;grid-template-columns:repeat(3,180px);column-gap:0;row-gap:32px;}
.ov-cta > div:first-child{grid-column:span 2;}
.ov-mail{display:block;font-size:13px;font-weight:700;color:#0a0a0a;text-decoration:none;cursor:none;transition:opacity .2s;font-family:"Raleway",sans-serif;}
.ov-mail:hover{opacity:.5;}

/* Intro: der Name wie in der Navigation, nur größer */
#intro{position:fixed;inset:0;z-index:950;background:#fff;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:opacity .5s ease;}
#intro .ov-title{font-size:clamp(26px,5.2vw,80px);margin:0;text-align:center;}
#intro .meta{position:absolute;left:36px;right:36px;bottom:20px;display:flex;justify-content:space-between;font-size:10px;color:#aaa;font-family:"Raleway",sans-serif;}
#intro.out .ov-title .ln > span{opacity:0;transform:translateY(-20px);transition-duration:.45s;transition-delay:0s;}
#intro.gone{opacity:0;}

/* Gemeinsamer Grund der Bühnen: Punktraster wie im Archiv */
.gw-stage,.kc-stage{position:relative;z-index:10;background:#f7f7f7;background-image:radial-gradient(circle,#d0d0d0 1px,transparent 1px);background-size:32px 32px;}

/* Georgia Website: Ebenen fächern sich auf */
.gw-stage{height:260vh;}
.gw-sticky{position:sticky;top:0;height:100vh;overflow:hidden;perspective:1800px;}
.gw-layer{position:absolute;left:50%;top:50%;width:min(60vw,920px);border-radius:3px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.12),0 1px 4px rgba(0,0,0,.08);will-change:transform;}
.gw-layer img{width:100%;display:block;}
.gw-cap{position:absolute;left:36px;right:36px;bottom:20px;display:flex;justify-content:space-between;font-size:10px;color:#aaa;font-family:"Raleway",sans-serif;}
.gw-cap a{color:#aaa;text-decoration:none;cursor:none;transition:color .2s;}
.gw-cap a:hover{color:#0a0a0a;}

/* TikTok: Zahlen wie die Typo der Seite, Videos als Karten im Handyformat */
.tt-stage{position:relative;z-index:10;background:#fff;padding:80px 36px 64px;}
.tt-big{font-family:"Raleway",sans-serif;font-weight:100;font-size:clamp(40px,8vw,120px);line-height:1;letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap;
  background:linear-gradient(to bottom,#3a3a3a 0%,#a0a0a0 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.tt-row{display:grid;grid-template-columns:repeat(4,180px);gap:24px 0;margin-top:56px;}
.tt-num{font-family:"Raleway",sans-serif;font-weight:200;font-size:22px;letter-spacing:-.02em;color:#0a0a0a;font-variant-numeric:tabular-nums;margin-bottom:4px;}
.tt-row .ov-lbl{margin:0;}
.tt-phones{position:relative;z-index:10;background:#fff;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;padding:0 36px 40px;}
.tt-phone{position:relative;aspect-ratio:9/16;border-radius:3px;overflow:hidden;background:#e4e4e0;box-shadow:0 4px 24px rgba(0,0,0,.12),0 1px 4px rgba(0,0,0,.08);}
.tt-phone video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}

/* Kalender: echtes Format, Blätter klappen beim Scrollen hoch */
.kc-sticky{position:sticky;top:0;height:100vh;display:flex;align-items:center;justify-content:center;perspective:2200px;overflow:hidden;}
.kc-cal{position:relative;height:min(74vh,122vw);aspect-ratio:1132/1600;transform-style:preserve-3d;}
.kc-page{position:absolute;inset:0;transform-origin:50% 0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:3px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.12),0 1px 4px rgba(0,0,0,.08);background:#fff;will-change:transform;}
.kc-page img{width:100%;height:100%;object-fit:cover;display:block;}
.kc-bind{position:absolute;left:8%;right:8%;top:-10px;height:20px;z-index:50;background:radial-gradient(circle,#2a2a2a 3px,transparent 3.5px) 0 50%/22px 20px repeat-x;}
.kc-count{position:absolute;left:36px;bottom:20px;font-size:10px;color:#aaa;font-family:"Raleway",sans-serif;font-variant-numeric:tabular-nums;}
.kc-hero{position:relative;z-index:10;height:100vh;overflow:hidden;}
.kc-hero img{width:100%;height:100%;object-fit:cover;display:block;}

@media (max-width:600px){
  .ov-cta{grid-template-columns:1fr 1fr;}
  .ov-cta > div:first-child{grid-column:1/-1;}
  .tt-row{grid-template-columns:1fr 1fr;}
  .tt-phones{grid-template-columns:1fr 1fr;padding:0 20px 40px;gap:10px;}
  .gw-layer{width:84vw;}
  .ov-finale,.tt-stage{padding-left:20px;padding-right:20px;}
  .gw-cap,.kc-count{left:20px;right:20px;}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;transition-delay:0s!important;animation-duration:.01ms!important;}
  .ov-grid-item{opacity:1;transform:none;}
  .ov-title .ln > span{opacity:1;transform:none;}
}

</style>
</head>

  { id:'grafik',title:'Graphic\nSelection',sub:'Poster & Awards',bg:'#1a1a1a',fg:'light',cover:'assets/images/grafik/grafik_02.png',preview:null,client:'Various',year:'2020 –',discipline:'Graphic Design',body:'A curated selection of posters that engage with visual communication, social criticism, and speculative aesthetics. Each poster is understood as a visual statement—partly political, partly poetic—reflecting themes such as perception, control, and emotion. The collection combines competition entries, client commissions, and personal works. All works share an interest in composition, materiality, and the tension between analog and digital formal languages.',media:[{type:'img',src:'assets/images/grafik/grafik_02.png'},{type:'img',src:'assets/images/grafik/grafik_03.jpg'},{type:'img',src:'assets/images/grafik/grafik_04.png'},{type:'img',src:'assets/images/grafik/grafik_05.png'},{type:'img',src:'assets/images/grafik/grafik_06.jpg'},{type:'img',src:'assets/images/grafik/grafik_07.jpg'},{type:'img',src:'assets/images/grafik/grafik_14.jpg'},{type:'img',src:'assets/images/grafik/grafik_15.jpg'},{type:'img',src:'assets/images/grafik/grafik_16.jpg'},{type:'img',src:'assets/images/grafik/grafik_17.jpg'},{type:'img',src:'assets/images/grafik/grafik_18.png'},{type:'img',src:'assets/images/grafik/grafik_26.png'},{type:'img',src:'assets/images/grafik/grafik_27.jpg'},{type:'img',src:'assets/images/grafik/grafik_28.png'},{type:'img',src:'assets/images/grafik/grafik_29.png'},{type:'img',src:'assets/images/grafik/grafik_33.png'},{type:'img',src:'assets/images/grafik/grafik_34.png'},{type:'img',src:'assets/images/grafik/grafik_35.png'},{type:'img',src:'assets/images/grafik/grafik_36.png'}] },

var PORTRAIT_VERT=`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`;
var PORTRAIT_FRAG=`precision highp float;
uniform sampler2D uTexture;uniform float uTime;uniform vec2 uMouse;
uniform float uRevealRadius;uniform float uRevealSoftness;uniform float uPixelSize;uniform float uMouseActive;
uniform float uWaveSpeed;uniform float uWaveFrequency;uniform float uWaveAmplitude;uniform float uMouseRadius;
varying vec2 vUv;
float bayer4x4(vec2 pos){
  int x=int(mod(pos.x,4.0));int y=int(mod(pos.y,4.0));int index=x+y*4;
  float p[16];p[0]=0.0;p[1]=8.0;p[2]=2.0;p[3]=10.0;p[4]=12.0;p[5]=4.0;p[6]=14.0;p[7]=6.0;
  p[8]=3.0;p[9]=11.0;p[10]=1.0;p[11]=9.0;p[12]=15.0;p[13]=7.0;p[14]=13.0;p[15]=5.0;
  for(int i=0;i<16;i++){if(i==index)return p[i]/16.0;}return 0.0;
}
void main(){
  vec2 uv=vUv;
  float ws=uWaveAmplitude*0.1;
  vec2 d=uv;
  d.x+=sin(uv.y*uWaveFrequency+uTime*uWaveSpeed)*ws;
  d.y+=sin(uv.x*uWaveFrequency*0.7+uTime*uWaveSpeed*0.8)*ws*0.5;
  if(uMouseActive>0.01){
    float dist=distance(uv,uMouse);
    float mi=smoothstep(uMouseRadius,0.0,dist);
    float ripple=sin(dist*uWaveFrequency*5.0-uTime*uWaveSpeed)*uWaveAmplitude*0.05*mi*uMouseActive;
    d.x+=ripple;d.y+=ripple;
  }
  vec4 color=texture2D(uTexture,d);
  float gray=dot(color.rgb,vec3(0.299,0.587,0.114));
  vec2 pc=floor(gl_FragCoord.xy/uPixelSize);
  float dither=bayer4x4(pc);
  float adj=gray+(dither-0.5)*0.5;
  float q=adj<0.33?0.0:adj<0.66?0.5:1.0;
  float rd=distance(uv,uMouse);
  float ra=(1.0-smoothstep(uRevealRadius*(1.0-uRevealSoftness),uRevealRadius,rd))*uMouseActive;
  gl_FragColor=vec4(mix(vec3(q),color.rgb,ra),color.a);
}`;

function initPortraitEffect(canvas){
  var sc=new THREE.Scene();
  var cam=new THREE.OrthographicCamera(-1,1,1,-1,0.1,10);
  cam.position.z=1;
  var w=canvas.offsetWidth,h=canvas.offsetHeight;
  var rdr=new THREE.WebGLRenderer({canvas:canvas,antialias:false});
  rdr.setPixelRatio(Math.min(window.devicePixelRatio,2));
  rdr.setSize(w,h,false);
  var uni={
    uTexture:{value:null},uTime:{value:0},uMouse:{value:new THREE.Vector2(-10,-10)},
    uRevealRadius:{value:0.25},uRevealSoftness:{value:0.5},uPixelSize:{value:3.0},
    uMouseActive:{value:0},uWaveSpeed:{value:0.5},uWaveFrequency:{value:3.0},
    uWaveAmplitude:{value:0.2},uMouseRadius:{value:0.2}
  };
  var geo=new THREE.PlaneGeometry(2,2);
  var mat=new THREE.ShaderMaterial({vertexShader:PORTRAIT_VERT,fragmentShader:PORTRAIT_FRAG,uniforms:uni});
  var mesh=new THREE.Mesh(geo,mat);
  sc.add(mesh);
  new THREE.TextureLoader().load('assets/images/info/portrait.jpg',function(tex){
    uni.uTexture.value=tex;
    var ia=tex.image.naturalWidth/tex.image.naturalHeight;
    var ca=canvas.offsetWidth/canvas.offsetHeight;
    if(ia>ca)mesh.scale.set(ia/ca,1,1);else mesh.scale.set(1,ca/ia,1);
  });
  var mActive=0,mIn=false,t0=performance.now();
  canvas.addEventListener('mouseenter',function(){mIn=true;});
  canvas.addEventListener('mouseleave',function(){mIn=false;});
  canvas.addEventListener('mousemove',function(e){
    var r=canvas.getBoundingClientRect();
    uni.uMouse.value.set((e.clientX-r.left)/r.width,1-(e.clientY-r.top)/r.height);
  });
  var aid;
  function loop(){
    aid=requestAnimationFrame(loop);
    uni.uTime.value=(performance.now()-t0)/1000;
    mActive+=((mIn?1:0)-mActive)*0.08;
    uni.uMouseActive.value=mActive;
    rdr.render(sc,cam);
  }
  loop();
  return function(){cancelAnimationFrame(aid);rdr.dispose();geo.dispose();mat.dispose();};
}

function makeEl(tag,props){
  var el=document.createElement(tag);
  Object.keys(props).forEach(function(k){el[k]=props[k];});
  el.setAttribute('draggable','false');
  return el;
}

function startSlideshow(face){
  var slides=face.querySelectorAll('.face-slide');
  var current=0;
  setInterval(function(){
    var prev=current;
    slides[prev].classList.remove('active');
    slides[prev].classList.add('prev');
    setTimeout(function(){slides[prev].classList.remove('prev');},600);
    current=(current+1)%slides.length;
    slides[current].classList.add('active');
  },3000);
}

function build(){
  ring.innerHTML='';
  var vw=window.innerWidth;
  var cW=Math.round(vw*0.26);
  var cH=Math.round(cW*0.5625); // 16:9 Querformat
  RADIUS=Math.max(Math.round((cW+20)/(2*Math.sin(Math.PI/N))),Math.round(vw*0.20));
  scene.style.perspective=Math.round(RADIUS*4.5)+'px';
  PROJECTS.forEach(function(proj,i){
    var slot=document.createElement('div');
    slot.className='slot';
    slot.style.transform='rotateY('+(i*STEP)+'deg) translateZ('+RADIUS+'px)';
    var face=document.createElement('div');
    face.className='face';
    face.style.cssText='width:'+cW+'px;height:'+cH+'px;background:'+proj.bg+';margin-left:'+(-cW/2)+'px;margin-top:'+(-cH/2)+'px;';
    face.dataset.dark=proj.fg==='light'?'1':'0';
    face.dataset.index=i;
    if(proj.preview){
      var vid=makeEl('video',{className:'face-video',src:proj.preview,autoplay:true,muted:true,loop:true,playsInline:true});
      face.appendChild(vid);
    } else if(proj.id==='kalender'||proj.id==='grafik'){
      // Bildpaare sliden alle 3 Sekunden
      var imgs=proj.media.filter(function(m){return m.type==='img';});
      var pairs=[];
      for(var p=0;p<imgs.length-1;p+=2){ pairs.push([imgs[p],imgs[p+1]]); }
      if(imgs.length%2!==0){ pairs.push([imgs[imgs.length-1],imgs[0]]); }

      var duoWrap=document.createElement('div');
      duoWrap.style.cssText='position:absolute;inset:0;overflow:hidden;';

      pairs.forEach(function(pair,pi){
        var duo=document.createElement('div');
        duo.style.cssText='position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:0;'
          +'transition:transform 0.6s cubic-bezier(0.4,0,0.2,1);'
          +'transform:translateX('+(pi===0?'0':'100')+'%);';
        pair.forEach(function(m){
          var img=document.createElement('img');
          img.src=m.src;
          img.style.cssText='width:100%;height:100%;object-fit:cover;display:block;';
          duo.appendChild(img);
        });
        duoWrap.appendChild(duo);
      });

      face.appendChild(duoWrap);

      var curPair=0;
      var duos=duoWrap.children;
      setInterval(function(){
        duos[curPair].style.transform='translateX(-100%)';
        curPair=(curPair+1)%pairs.length;
        // alle anderen rechts rausstellen (außer current)
        for(var x=0;x<duos.length;x++){
          if(x!==curPair && duos[x].style.transform!=='translateX(-100%)'){
            duos[x].style.transition='none';
            duos[x].style.transform='translateX(100%)';
          }
        }
        duos[curPair].style.transition='none';
        duos[curPair].style.transform='translateX(100%)';
        // kurz warten dann reinslideen
        requestAnimationFrame(function(){
          requestAnimationFrame(function(){
            duos[curPair].style.transition='transform 0.6s cubic-bezier(0.4,0,0.2,1)';
            duos[curPair].style.transform='translateX(0%)';
          });
        });
      },3000);
    } else {
      var imgs=proj.media.filter(function(m){return m.type==='img';});
      if(imgs.length>1){
        imgs.forEach(function(m,idx){
          var img=makeEl('img',{className:'face-slide'+(idx===0?' active':''),src:m.src});
          face.appendChild(img);
        });
        startSlideshow(face);
      } else {
        var src=imgs.length?imgs[0].src:proj.cover;
        var img=makeEl('img',{className:'face-img',src:src});
        face.appendChild(img);
      }
    }
    face.addEventListener('click',function(e){e.stopPropagation();if(!wasDrag)openProject(proj,face);});
    face.addEventListener('mouseenter',function(){if(face.dataset.dark==='1')cur.classList.add('light');});
    face.addEventListener('mouseleave',function(){cur.classList.remove('light');});
    face.querySelectorAll('img').forEach(function(im){im.alt=(proj.title||'').replace('\n',' ')+' — '+proj.sub;});
    slot.appendChild(face);ring.appendChild(slot);
  });
  updateZ();
}

function updateZ(){
  ring.querySelectorAll('.slot').forEach(function(s,i){
    var wa=((i*STEP+spinAngle)%360+360)%360;
    var dist=Math.min(wa,360-wa);
    s.style.zIndex=Math.round(1000-dist*3);
    s.style.opacity=(0.3+(1-dist/180)*0.7).toFixed(2);
  });
}

// ── Intro Animation (Variante A — Karten fliegen rein) ───────────
var introPlayed=false;
function runIntro(){
  if(introPlayed)return;
  introPlayed=true;
  var slots=ring.querySelectorAll('.slot');
  slots.forEach(function(slot,i){
    slot.style.transition='none';
    slot.style.opacity='0';
    // Karten starten weit unten außerhalb des Sichtbereichs
    slot.style.transform='rotateY('+(i*STEP)+'deg) translateZ('+RADIUS+'px) translateY(120px)';
  });
  setTimeout(function(){
    slots.forEach(function(slot,i){
      var delay=(i*0.08)+'s';
      slot.style.transition='transform 0.9s cubic-bezier(0.2,1,0.3,1) '+delay+', opacity 0.6s ease '+delay;
      slot.style.opacity='1';
      slot.style.transform='rotateY('+(i*STEP)+'deg) translateZ('+RADIUS+'px) translateY(0px)';
    });
    // Transitions aufräumen wenn fertig
    setTimeout(function(){
      slots.forEach(function(slot,i){
        slot.style.transition='';
        slot.style.transform='rotateY('+(i*STEP)+'deg) translateZ('+RADIUS+'px)';
      });
      updateZ();
    },slots.length*80+1000);
  },200);
}

build();
window.addEventListener('resize',build);
startIntro(runIntro);

scene.addEventListener('mousedown',function(e){
  if(isOpen)return;
  isDragging=true;wasDrag=false;
  startX=e.clientX;startSpin=targetSpin;
  lastX=e.clientX;velX=0;lastT=performance.now();
  cur.classList.add('drag');cancelAnimationFrame(rafId);
  e.preventDefault();
});
window.addEventListener('mousemove',function(e){
  cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px';
  if(!isDragging)return;
  if(Math.abs(e.clientX-startX)>4)wasDrag=true;
  var now=performance.now();velX=(e.clientX-lastX)/Math.max(now-lastT,1);lastX=e.clientX;lastT=now;
  targetSpin=startSpin+(e.clientX-startX)/window.innerWidth*360*0.7;
  spinAngle=targetSpin;ring.style.transform='rotateY('+spinAngle+'deg)';updateZ();
});
window.addEventListener('mouseup',function(){
  if(!isDragging)return;
  isDragging=false;cur.classList.remove('drag');
  targetSpin+=velX*38;targetSpin=Math.round(targetSpin/STEP)*STEP;ease();
});
scene.addEventListener('touchstart',function(e){
  if(isOpen)return;
  var t=e.touches[0];isDragging=true;wasDrag=false;
  startX=t.clientX;startY=t.clientY;startSpin=targetSpin;lastX=0;velX=0;lastT=performance.now();
},{passive:true});
window.addEventListener('touchmove',function(e){
  if(!isDragging)return;
  var t=e.touches[0],dx=t.clientX-startX,dy=t.clientY-startY;
  // Swipe in jede Richtung: die stärkere Achse dreht das Karussell (hoch = wie links)
  var d=Math.abs(dx)>=Math.abs(dy)?dx:dy*0.7;
  if(Math.abs(dx)>4||Math.abs(dy)>4)wasDrag=true;
  var now=performance.now();velX=(d-lastX)/Math.max(now-lastT,1);lastX=d;lastT=now;
  targetSpin=startSpin+d/window.innerWidth*360*0.7;
  spinAngle=targetSpin;ring.style.transform='rotateY('+spinAngle+'deg)';updateZ();
  if(e.cancelable)e.preventDefault(); // Safari: kein Scrollen/Gummiband/Neuladen, solange das Karussell dreht
},{passive:false});
window.addEventListener('touchend',function(){
  isDragging=false;targetSpin+=velX*25;targetSpin=Math.round(targetSpin/STEP)*STEP;ease();
});

function ease(){
  cancelAnimationFrame(rafId);
  function step(){
    var diff=targetSpin-spinAngle;
    if(Math.abs(diff)<0.02){spinAngle=targetSpin;ring.style.transform='rotateY('+spinAngle+'deg)';updateZ();return;}
    spinAngle+=diff*0.12;ring.style.transform='rotateY('+spinAngle+'deg)';updateZ();rafId=requestAnimationFrame(step);
  }
  rafId=requestAnimationFrame(step);
}

var camX=0,camY=0,mNX=0,mNY=0;
document.addEventListener('mousemove',function(e){

});
(function animCam(){
  requestAnimationFrame(animCam);
  if(isOpen)return;
  camY+=(mNX*7-camY)*0.05;camX+=(-mNY*5-camX)*0.05;
  camera.style.transform='rotateX('+camX.toFixed(2)+'deg) rotateY('+camY.toFixed(2)+'deg)';
  camera.style.transformStyle='preserve-3d';
})();

    var F='font-family:Raleway,sans-serif;';

    wrap.style.cssText='min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:96px 20px 60px;box-sizing:border-box;';
    ovEl.appendChild(wrap);

    function el(tag,css,txt){var e=document.createElement(tag);if(css)e.style.cssText=css;if(txt!=null)e.textContent=txt;return e;}
    function hover(b){b.addEventListener('mouseenter',function(){cur.classList.add('link');});b.addEventListener('mouseleave',function(){cur.classList.remove('link');});}
    function btn(txt){var b=el('button',F+'background:none;border:1px solid #0a0a0a;color:#0a0a0a;font-size:10px;letter-spacing:.2em;text-transform:uppercase;padding:14px 0;width:130px;cursor:none;',txt);hover(b);return b;}

    function shuffle(){for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=order[i];order[i]=order[j];order[j]=x;}}

    function start(){
      shuffle();idx=0;score=0;answers=[];busy=false;
      wrap.innerHTML='';
      wrap.appendChild(el('p',F+'font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:#aaa;margin:0 0 10px;','Little Game'));
      wrap.appendChild(el('p',F+'font-size:clamp(26px,5vw,40px);font-weight:200;color:#0a0a0a;margin:0 0 8px;letter-spacing:-.01em;','Real or AI?'));
      wrap.appendChild(el('p',F+'font-size:13px;font-weight:300;color:#888;margin:0 0 34px;text-align:center;','Nine images. Only one is a photograph. Swipe right for real, left for AI.'));
      var stage=el('div','position:relative;width:min(340px,78vw);aspect-ratio:3/4;');
      stage.id='lg-stage';wrap.appendChild(stage);
      var meta=el('p',F+'font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#aaa;margin:22px 0 18px;');meta.id='lg-meta';wrap.appendChild(meta);
      var row=el('div','display:flex;gap:14px;');
      var bAI=btn('← AI'),bReal=btn('Real →');
      bAI.onclick=function(){answer(false);};bReal.onclick=function(){answer(true);};
      row.appendChild(bAI);row.appendChild(bReal);wrap.appendChild(row);
      next();
    }

    function card(i,depth){
      var c=el('div','position:absolute;inset:0;background:#e9e3da;box-shadow:0 18px 50px rgba(0,0,0,.12);overflow:hidden;touch-action:none;transition:transform .45s cubic-bezier(.2,1,.3,1),opacity .45s ease;transform:translateY('+(depth*10)+'px) scale('+(1-depth*0.04)+');z-index:'+(10-depth)+';');
      var im=el('img','width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;');im.src=imgs[i].src;im.alt='';
      c.appendChild(im);
      var stamp=el('div',F+'position:absolute;top:18px;padding:6px 12px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;border:1.5px solid currentColor;opacity:0;transition:opacity .15s;');
      c.appendChild(stamp);c._stamp=stamp;
      return c;
    }

    function next(){
      var stage=document.getElementById('lg-stage'),meta=document.getElementById('lg-meta');
      if(!stage)return;
      busy=false;
      if(idx>=order.length){finish();return;}
      stage.innerHTML='';
      if(idx+1<order.length)stage.appendChild(card(order[idx+1],1));
      var top=card(order[idx],0);stage.appendChild(top);
      meta.textContent=(idx+1)+' / '+order.length;
      drag(top);
    }

    function drag(c){
      var sx=0,sy=0,dx=0,on=false;
      c.addEventListener('pointerdown',function(e){on=true;sx=e.clientX;sy=e.clientY;dx=0;c.style.transition='none';c.setPointerCapture(e.pointerId);});
      c.addEventListener('pointermove',function(e){
        if(!on)return;dx=e.clientX-sx;var dy=e.clientY-sy;
        c.style.transform='translate('+dx+'px,'+(dy*0.3)+'px) rotate('+(dx/18)+'deg)';
        var s=c._stamp;s.style.opacity=Math.min(Math.abs(dx)/80,1);
        if(dx>0){s.textContent='Real';s.style.left='18px';s.style.right='';s.style.color='#0a0a0a';}
        else{s.textContent='AI';s.style.right='18px';s.style.left='';s.style.color='#0a0a0a';}
      });
      function up(){
        if(!on)return;on=false;
        c.style.transition='transform .45s cubic-bezier(.2,1,.3,1),opacity .45s ease';
        if(Math.abs(dx)>90){answer(dx>0);}else{c.style.transform='';c._stamp.style.opacity=0;}
      }
      c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
    }

    function answer(saysReal){
      var stage=document.getElementById('lg-stage');if(busy||!stage||idx>=order.length)return;busy=true;
      var top=stage.lastChild,i=order[idx],isReal=(i===REAL),ok=(saysReal===isReal);
      if(ok)score++;answers.push({i:i,ok:ok});
      var s=top._stamp;s.textContent=(isReal?'Real':'AI')+(ok?' ✓':' ✗');s.style.opacity=1;
      s.style.left=saysReal?'18px':'';s.style.right=saysReal?'':'18px';
      top.style.transition='transform .5s ease-in,opacity .5s ease-in';
      setTimeout(function(){top.style.transform='translateX('+(saysReal?140:-140)+'%) rotate('+(saysReal?24:-24)+'deg)';top.style.opacity='0';},380);
      idx++;setTimeout(next,820);
    }

    function finish(){
      wrap.innerHTML='';
      wrap.appendChild(el('p',F+'font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:#aaa;margin:0 0 10px;','Your result'));
      wrap.appendChild(el('p',F+'font-size:clamp(40px,8vw,64px);font-weight:200;color:#0a0a0a;margin:0 0 6px;',score+' / '+order.length));
      wrap.appendChild(el('p',F+'font-size:13px;font-weight:300;color:#888;margin:0 0 36px;text-align:center;',score===order.length?'Sharp eye. You can still tell the difference.':'The line between real and generated is thinner than it looks.'));
      var g=el('div','display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(420px,88vw);margin-bottom:34px;');
      imgs.forEach(function(m,i){
        var a=answers.filter(function(x){return x.i===i;})[0];
        var cell=el('div','position:relative;aspect-ratio:3/4;background:#e9e3da;overflow:hidden;'+(i===REAL?'outline:2px solid #0a0a0a;outline-offset:2px;':''));
        var im=el('img','width:100%;height:100%;object-fit:cover;display:block;'+(i===REAL?'':'filter:grayscale(1) brightness(.85);'));im.src=m.src;im.alt='';
        cell.appendChild(im);
        cell.appendChild(el('span',F+'position:absolute;left:0;right:0;bottom:0;padding:6px 8px;font-size:9px;letter-spacing:.15em;text-transform:uppercase;background:'+(i===REAL?'#0a0a0a;color:#fff;':'rgba(255,255,255,.85);color:#0a0a0a;'),(i===REAL?'Real':'AI')+(a?(a.ok?' ✓':' ✗'):'')));
        g.appendChild(cell);
      });
      wrap.appendChild(g);
      var again=btn('Play again');again.style.width='180px';again.onclick=start;wrap.appendChild(again);
    }

    function key(e){
      if(!document.getElementById('lg-stage')){document.removeEventListener('keydown',key);return;}
      if(e.key==='ArrowLeft')answer(false);else if(e.key==='ArrowRight')answer(true);
    }
    document.addEventListener('keydown',key);

    start();
    wrap.style.opacity='0';wrap.style.transition='opacity .8s ease';
    setTimeout(function(){wrap.style.opacity='1';},60);
    return;
  }

  // ── Kalender: 2er-Reihen + _11 bildschirmfüllend unten ───────
  if(proj.id==='kalender'&&!RM){ buildKalender(proj); return; }
  if(proj.id==='georgia-web'){ buildGeorgiaWeb(proj); return; }
  if(proj.id==='tiktok'){ buildTikTok(proj); return; }
  if(proj.id==='kalender'){
    var allImgs=proj.media.filter(function(m){return m.type==='img';});
    var lastImg=allImgs[10]; // kalender_11 querformat
    var restImgs=allImgs.slice(0,10); // kalender_01 bis _10

    ovEl.innerHTML='';

    var content=document.createElement('div');
    content.className='ov-content';
    content.innerHTML=titleHTML(proj)+'<p class="ov-desc">'+proj.body+'</p>'
      +'<div class="ov-cols">'
      +'<div><span class="ov-col-label">Client</span><span class="ov-col-val">'+proj.client+'</span></div>'
      +'<div><span class="ov-col-label">Year</span><span class="ov-col-val">'+proj.year+'</span></div>'
      +'</div>';
    ovEl.appendChild(content);

    var grid=document.createElement('div');
    grid.className='ov-grid';
    grid.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:4px;';

    restImgs.forEach(function(m){
      var item=document.createElement('div');
      item.className='ov-grid-item';
      item.style.cssText='overflow:hidden;';
      var img=document.createElement('img');
      img.src=m.src; img.loading='lazy';
      img.style.cssText='width:100%;height:auto;display:block;';
      item.appendChild(img);
      grid.appendChild(item);
    });

    // _11 ganz unten bildschirmfüllend
    var heroItem=document.createElement('div');
    heroItem.style.cssText='grid-column:1/-1;width:100%;height:100vh;overflow:hidden;';
    var heroImg=document.createElement('img');
    heroImg.src=lastImg.src; heroImg.loading='lazy';
    heroImg.style.cssText='width:100%;height:100%;object-fit:cover;display:block;';
    heroItem.appendChild(heroImg);
    grid.appendChild(heroItem);

    ovEl.appendChild(grid);
    return;
  }

  // ── Standard Layout ───────────────────────────────────────────
  var content=document.createElement('div');
  content.className='ov-content';
  content.innerHTML=titleHTML(proj)+'<p class="ov-desc">'+proj.body+'</p>'
    +'<div class="ov-cols">'
    +'<div><span class="ov-col-label">Client</span><span class="ov-col-val">'+proj.client+'</span></div>'
    +'<div><span class="ov-col-label">Year</span><span class="ov-col-val">'+proj.year+'</span></div>'
    +'</div>';

  var grid=document.createElement('div');
  grid.className='ov-grid';

  proj.media.forEach(function(m,i){
    var item=document.createElement('div');
    item.className=((i===0&&proj.id!=='grafik'&&proj.id!=='tiktok')||(i===1&&proj.id==='georgia'))?'ov-grid-item full':'ov-grid-item';

    if(m.type==='video'){
      var vid=document.createElement('video');
      vid.dataset.src=m.src;
      vid.preload='none';
      if(m.ar)vid.style.aspectRatio=m.ar;
      vid.muted=true;
      vid.loop=true;
      vid.playsInline=true;
      vid.style.width='100%';vid.style.height='auto';vid.style.display='block';
      item.appendChild(vid);
      item.appendChild(makeMuteBtn(vid));
    } else {
      var img=document.createElement('img');
      img.src=m.src;
      img.loading='lazy';
      img.style.cssText='width:100%;height:auto;display:block;';
      item.appendChild(img);
    }
    grid.appendChild(item);
  });

  ovEl.innerHTML='';
  ovEl.appendChild(content);
  ovEl.appendChild(grid);
}

      el.innerHTML='<p style="font-family:Raleway,sans-serif;font-size:13px;line-height:1.85;color:#555;font-weight:300;">'+item.text+'</p>';
    }
    canvas.appendChild(el);
  });

  // ── Pan & Zoom ──────────────────────────────────────────────────
  var tx=-300, ty=-100, scale=1;
  var minScale=0.1, maxScale=4;
  var dragging=false, startX, startY, startTx, startTy;

  function applyTransform(){
    canvas.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')';
  }
  applyTransform();

  var wrap=document.getElementById('arc-wrap');

  wrap.addEventListener('wheel',function(e){
    e.preventDefault();
    var rect=wrap.getBoundingClientRect();
    var mx=e.clientX-rect.left;
    var my=e.clientY-rect.top;
    var delta=e.deltaY<0?1.1:0.9;
    var newScale=Math.min(maxScale,Math.max(minScale,scale*delta));
    // zoom toward mouse pointer
    tx=mx-(mx-tx)*(newScale/scale);
    ty=my-(my-ty)*(newScale/scale);
    scale=newScale;
    applyTransform();
  },{passive:false});

  var dragCard=null, dragOffX, dragOffY;

  wrap.addEventListener('mousedown',function(e){
    if(e.button!==0)return;
    var card=e.target.closest('.arc-item');
    if(card){
      // drag card
      dragCard=card;
      var cardX=parseFloat(card.style.left)||0;
      var cardY=parseFloat(card.style.top)||0;
      // mouse position in canvas space
      dragOffX=(e.clientX-tx)/scale - cardX;
      dragOffY=(e.clientY-ty)/scale - cardY;
      card.style.zIndex=999;
      card.style.transition='none';
      wrap.style.cursor='grabbing';
      e.stopPropagation();
    } else {
      // pan board
      dragging=true;
      startX=e.clientX; startY=e.clientY;
      startTx=tx; startTy=ty;
      wrap.style.cursor='grabbing';
    }
  });
  window.addEventListener('mousemove',function(e){
    if(dragCard){
      var newX=(e.clientX-tx)/scale - dragOffX;
      var newY=(e.clientY-ty)/scale - dragOffY;
      dragCard.style.left=newX+'px';
      dragCard.style.top=newY+'px';
    } else if(dragging){
      tx=startTx+(e.clientX-startX);
      ty=startTy+(e.clientY-startY);
      applyTransform();
    }
  });
  window.addEventListener('mouseup',function(){
    if(dragCard){dragCard.style.zIndex='';dragCard=null;}
    if(dragging){dragging=false;}
    wrap.style.cursor='grab';
  });

  // touch support
  var lastTouchDist=null, lastTouchMid=null;
  wrap.addEventListener('touchstart',function(e){
    if(e.touches.length===1){
      dragging=true;
      startX=e.touches[0].clientX; startY=e.touches[0].clientY;
      startTx=tx; startTy=ty;
    } else if(e.touches.length===2){
      dragging=false;
      var dx=e.touches[0].clientX-e.touches[1].clientX;
      var dy=e.touches[0].clientY-e.touches[1].clientY;
      lastTouchDist=Math.sqrt(dx*dx+dy*dy);
      lastTouchMid={x:(e.touches[0].clientX+e.touches[1].clientX)/2,y:(e.touches[0].clientY+e.touches[1].clientY)/2};
    }
  },{passive:true});
  wrap.addEventListener('touchmove',function(e){
    e.preventDefault();
    if(e.touches.length===1&&dragging){
      tx=startTx+(e.touches[0].clientX-startX);
      ty=startTy+(e.touches[0].clientY-startY);
      applyTransform();
    } else if(e.touches.length===2){
      var dx=e.touches[0].clientX-e.touches[1].clientX;
      var dy=e.touches[0].clientY-e.touches[1].clientY;
      var dist=Math.sqrt(dx*dx+dy*dy);
      if(lastTouchDist){
        var delta=dist/lastTouchDist;
        var newScale=Math.min(maxScale,Math.max(minScale,scale*delta));
        var rect=wrap.getBoundingClientRect();
        var mx=lastTouchMid.x-rect.left;
        var my=lastTouchMid.y-rect.top;
        tx=mx-(mx-tx)*(newScale/scale);
        ty=my-(my-ty)*(newScale/scale);
        scale=newScale;
        applyTransform();
      }
      lastTouchDist=dist;
    }
  },{passive:false});
  wrap.addEventListener('touchend',function(){dragging=false;lastTouchDist=null;});
});

var observer=new IntersectionObserver(function(entries){
  entries.forEach(function(entry){

      entry.target.classList.add('in-view');
      observer.unobserve(entry.target);
    }
  });
},{root:ovEl,threshold:0.1});

/* ══ Erweiterungen 10/2026: Titel, Finale, Bühnen, Intro, Videos ══ */

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

// Großer Projekttitel, Zeilen aus der Maske
function titleHTML(proj){
  var lines=String(proj.title||'').split('\n');
  return '<h1 class="ov-title">'+lines.map(function(l,i){
    return '<span class="ln"><span>'+esc(l)+'</span></span>';
  }).join('')+'</h1>';
}

// Scroll-gebundene Bewegungen im Overlay
var ovScrollFns=[];
var ovTick=false;
ovEl.addEventListener('scroll',function(){
  if(ovTick)return;ovTick=true;
  requestAnimationFrame(function(){ovTick=false;ovScrollFns.forEach(function(f){f();});});
});
function progressOf(stage){ // 0 → Bühne oben angekommen, 1 → Bühne durchgescrollt
  var r=stage.getBoundingClientRect();
  var range=stage.offsetHeight-window.innerHeight;
  return Math.min(1,Math.max(0,-r.top/Math.max(range,1)));
}
function easeOut3(x){return 1-Math.pow(1-x,3);}

// Videos erst laden und abspielen, wenn sie ins Bild kommen
var vidObs=new IntersectionObserver(function(entries){
  entries.forEach(function(en){
    var v=en.target.querySelector('video');if(!v)return;
    if(en.isIntersecting){
      if(!v.getAttribute('src')&&v.dataset.src){v.src=v.dataset.src;}
      var pr=v.play();if(pr&&pr.catch)pr.catch(function(){});
    } else { v.pause(); }
  });
},{root:ovEl,rootMargin:'200px 0px',threshold:0.01});

// Wrapper: baut das Projekt, hängt Finale an, setzt Alt-Texte, startet Beobachter
function buildOverlayHTML(proj){
  ovScrollFns=[];
  vidObs.disconnect();
  ovEl.innerHTML='';
  buildOverlayInner(proj);
  var name=(proj.title||'').replace('\n',' ');
  ovEl.querySelectorAll('img').forEach(function(im,i){if(!im.alt)im.alt=name+' — '+(i+1);});
  ovEl.appendChild(finaleEl(proj));
  ovEl.querySelectorAll('video[data-src]').forEach(function(v){vidObs.observe(v.parentElement);});
  ovScrollFns.forEach(function(f){f();});
}

function finaleEl(proj){
  var i=PROJECTS.indexOf(proj),next=PROJECTS[(i+1)%PROJECTS.length];
  var f=document.createElement('section');
  f.className='ov-finale';
  f.innerHTML='<span class="ov-lbl">Next Project</span>'
    +'<a href="#" class="ov-next">'+esc((next.title||'').replace('\n',' '))+' &rarr;</a>'
    +'<div class="ov-cta"><div><span class="ov-lbl">Available For</span>'
    +'<p class="ov-desc" style="margin-bottom:4px;">Social Content for Bars &amp; Venues</p>'
    +'<p class="ov-desc" style="color:#b0b0b0;">Berlin — ongoing or per project</p></div>'
    +'<div><span class="ov-lbl">Contact</span><a class="ov-mail" href="mailto:elhamli@outlook.de">elhamli@outlook.de</a></div></div>';

    el.addEventListener('mouseenter',function(){cur.classList.add('link');});

function contentEl(proj,extra){
  var c=document.createElement('div');
  c.className='ov-content';
  c.innerHTML=titleHTML(proj)+'<p class="ov-desc">'+proj.body+'</p>'+(extra||'')
    +'<div class="ov-cols"><div><span class="ov-col-label">Client</span><span class="ov-col-val">'+esc(proj.client)+'</span></div>'
    +'<div><span class="ov-col-label">Year</span><span class="ov-col-val">'+esc(proj.year)+'</span></div></div>';
  return c;
}

// ── Georgia Website: Ebenen fächern sich beim Scrollen auf ─────────
function buildGeorgiaWeb(proj){
  ovEl.appendChild(contentEl(proj));
  var stage=document.createElement('div');stage.className='gw-stage';
  var st=document.createElement('div');st.className='gw-sticky';stage.appendChild(st);
  var imgs=proj.media.filter(function(m){return m.type==='img';});
  var layers=imgs.map(function(m,i){
    var l=document.createElement('div');l.className='gw-layer';
    var im=document.createElement('img');im.src=m.src;im.loading='lazy';l.appendChild(im);
    st.appendChild(l);return l;
  });
  var cap=document.createElement('div');cap.className='gw-cap';
  cap.innerHTML='<span>Live — 2026</span><a href="https://www.georgiabar.de" target="_blank" rel="noopener noreferrer">georgiabar.de &#8599;</a>';
  st.appendChild(cap);
  ovEl.appendChild(stage);
  function upd(){
    var p=RM?1:easeOut3(progressOf(stage));
    var mob=window.innerWidth<=600;
    layers.forEach(function(l,i){
      var k=i-(layers.length-1)/2; // -1,0,1
      // Anfang: gestapelt und gekippt · Ende: flach nebeneinander (Handy: untereinander)
      var tx= mob?0:k*0.32*window.innerWidth*p;
      var ty= mob?k*0.3*window.innerHeight*p:k*18*(1-p)-30*(1-p);
      var tz= (i-(layers.length-1))*90*(1-p);
      var rx= 50*(1-p), rz=-12*(1-p);
      var s = mob?1-0.15*p:1-0.5*p;
      l.style.transform='translate(-50%,-50%) translate('+tx+'px,'+ty+'px) translateZ('+tz+'px) rotateX('+rx+'deg) rotateZ('+rz+'deg) scale('+s+')';
      l.style.zIndex=10+i;
    });
  }
  ovScrollFns.push(upd);
  window.addEventListener('resize',upd);
}

// ── TikTok: Zahlen zählen hoch, Videos im Handyformat ────────────
var TT_STATS=[[15132386,'Video views'],[320517,'Likes'],[81466,'Shares'],[66034,'Profile views'],[7155,'Comments']];
function buildTikTok(proj){
  var c=document.createElement('div');c.className='ov-content';
  c.innerHTML=titleHTML(proj)+'<div class="ov-cols"><div><span class="ov-col-label">Client</span><span class="ov-col-val">'+esc(proj.client)+'</span></div><div><span class="ov-col-label">Year</span><span class="ov-col-val">'+esc(proj.year)+'</span></div><div><span class="ov-col-label">Discipline</span><span class="ov-col-val">'+esc(proj.discipline)+'</span></div></div>';
  ovEl.appendChild(c);
  var s=document.createElement('div');s.className='tt-stage';
  s.innerHTML='<span class="ov-lbl">'+TT_STATS[0][1]+'</span><div class="tt-big" data-n="'+TT_STATS[0][0]+'">0</div>'
    +'<div class="tt-row">'+TT_STATS.slice(1).map(function(x){return '<div><div class="tt-num" data-n="'+x[0]+'">0</div><span class="ov-lbl">'+x[1]+'</span></div>';}).join('')+'</div>';
  ovEl.appendChild(s);
  var ph=document.createElement('div');ph.className='tt-phones';
  proj.media.forEach(function(m){
    if(m.type!=='video')return;
    var item=document.createElement('div');item.className='tt-phone ov-grid-item';
    var v=document.createElement('video');v.dataset.src=m.src;v.preload='none';v.muted=true;v.loop=true;v.playsInline=true;v.setAttribute('playsinline','');
    item.appendChild(v);item.appendChild(makeMuteBtn(v));ph.appendChild(item);
  });
  ovEl.appendChild(ph);
  var done=false;
  var io=new IntersectionObserver(function(en){
    if(!en[0].isIntersecting||done)return;done=true;io.disconnect();
    s.querySelectorAll('[data-n]').forEach(function(el){countUp(el,+el.dataset.n);});
  },{root:ovEl,threshold:0.3});
  io.observe(s);
}
function countUp(el,n){
  var fmt=function(x){return Math.round(x).toLocaleString('en-US');};
  if(RM){el.textContent=fmt(n);return;}
  var t0=performance.now(),dur=1800;
  (function step(now){
    var k=Math.min(1,(now-t0)/dur);el.textContent=fmt(n*(1-Math.pow(2,-10*k)));
    if(k<1)requestAnimationFrame(step);else el.textContent=fmt(n);
  })(t0);
}

// ── Kalender: echtes Format, Blätter klappen beim Scrollen nach oben ──
function buildKalender(proj){
  ovEl.appendChild(contentEl(proj));
  var imgs=proj.media.filter(function(m){return m.type==='img';});
  var pages=imgs.slice(0,10),last=imgs[10];
  var stage=document.createElement('div');stage.className='kc-stage';
  stage.style.height=(100+pages.length*45)+'vh';
  var st=document.createElement('div');st.className='kc-sticky';stage.appendChild(st);
  var cal=document.createElement('div');cal.className='kc-cal';st.appendChild(cal);
  var bind=document.createElement('div');bind.className='kc-bind';cal.appendChild(bind);
  var els=pages.map(function(m,i){
    var pg=document.createElement('div');pg.className='kc-page';pg.style.zIndex=String(pages.length-i);
    var im=document.createElement('img');im.src=m.src;if(i>1)im.loading='lazy';pg.appendChild(im);
    cal.appendChild(pg);return pg;
  });
  var cnt=document.createElement('div');cnt.className='kc-count';st.appendChild(cnt);
  ovEl.appendChild(stage);
  if(last){
    var hero=document.createElement('div');hero.className='kc-hero';
    var hi=document.createElement('img');hi.src=last.src;hi.loading='lazy';hero.appendChild(hi);
    ovEl.appendChild(hero);
  }
  function upd(){
    var p=progressOf(stage)*(pages.length-1);
    var shown=0;
    els.forEach(function(pg,i){
      var k=Math.min(1,Math.max(0,p-i));
      pg.style.transform='translateZ('+(-i*0.6)+'px) rotateX('+(k*178)+'deg)'; // Blatt klappt zum Betrachter hoch. Im 3D-Raum zählt die Tiefe, nicht der z-index
      if(k<0.5&&!shown)shown=i+1;
    });
    cnt.textContent=String(shown||pages.length).padStart(2,'0')+' / '+String(pages.length).padStart(2,'0');
  }
  ovScrollFns.push(upd);
}

// ── Intro: Name groß, dann übergibt er an den Ring (≤ 1,5 s, einmal pro Sitzung) ──
function startIntro(then){
  var seen=false;
  try{seen=sessionStorage.getItem('oeh-intro')==='1';sessionStorage.setItem('oeh-intro','1');}catch(e){}
  if(RM||seen){then();return;}
  var el=document.createElement('div');el.id='intro';
  el.innerHTML=titleHTML({title:'Oussama El Hamli'})+'<div class="meta"><span>Communication Design</span><span>Berlin</span></div>';
  document.body.appendChild(el);
  var h=el.querySelector('.ov-title');
  requestAnimationFrame(function(){requestAnimationFrame(function(){h.classList.add('in');});});
  setTimeout(function(){el.classList.add('out');},950);
  setTimeout(function(){el.classList.add('gone');then();},1250);
  setTimeout(function(){el.remove();},1800);
}
